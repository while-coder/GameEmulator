name: Release App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        uses: while-coder/workflows/.github/actions/resolve-release-info@main
        with:
          tag-prefix: v
          package-json: package.json
          changelog: CHANGELOG.md

  prepare-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Recreate GitHub Release
        uses: while-coder/workflows/.github/actions/recreate-github-release@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.check.outputs.tag }}
          title: nes-emulator v${{ needs.check.outputs.version }}
          notes: ${{ needs.check.outputs.notes }}

  release-desktop:
    needs: [check, prepare-release]
    uses: while-coder/workflows/.github/workflows/tauri-desktop-release.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      release-name: nes-emulator v${{ needs.check.outputs.version }}
      release-body: ${{ needs.check.outputs.notes }}
    secrets: inherit

  release-android:
    needs: [check, release-desktop]
    if: ${{ !cancelled() && needs.release-desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-android-release.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      asset-prefix: nes-emulator
      init-command: pnpm android:init
      build-command: pnpm run android:build -- --apk --aab
    secrets: inherit

  release-ios:
    needs: [check, release-desktop]
    if: ${{ !cancelled() && needs.release-desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-ios-unsigned.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      asset-prefix: nes-emulator
      init-command: pnpm ios:init
      build-command: pnpm run ios:build -- --target aarch64 --no-sign --ci
    secrets: inherit

  release-sidestore:
    name: Release SideStore source
    needs: [check, release-ios]
    if: ${{ !cancelled() && needs.release-ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download unsigned IPA
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release download "$TAG" --pattern '*_ios_unsigned.ipa' --output app.ipa

      - name: Generate SideStore source
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SIDESTORE_VERSION: ${{ needs.check.outputs.version }}
          SIDESTORE_NOTES: ${{ needs.check.outputs.notes }}
          SIDESTORE_OUTPUT: apps.json
        run: |
          set -euo pipefail
          SIDESTORE_SHA256="$(sha256sum app.ipa | cut -d' ' -f1)"
          SIDESTORE_SIZE="$(stat -c%s app.ipa)"
          SIDESTORE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nes-emulator_${SIDESTORE_VERSION}_ios_unsigned.ipa" \
            node scripts/sidestore-source.cjs

      - name: Upload SideStore source to release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release upload "$TAG" apps.json --clobber

  publish-manifest:
    needs: [check, release-desktop]
    if: ${{ !cancelled() && needs.release-desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-updater-manifest.yml@main
    with:
      product-prefix: nes-emulator
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      release-notes: ${{ needs.check.outputs.notes }}
    secrets: inherit

  deploy-pages:
    name: Deploy Pages
    needs: [check, prepare-release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: while-coder/workflows/.github/actions/install-pnpm-dependencies@main
      - run: pnpm --filter @nes-emulator/pwa run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pwa/dist

      - id: deployment
        name: Deploy Pages until success
        uses: actions/github-script@v9
        with:
          script: |
            const artifactName = 'github-pages';
            const retryDelayMs = 5000;
            const { owner, repo } = context.repo;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function getPagesArtifact() {
              const artifacts = [];
              let page = 1;
              while (true) {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts',
                  {
                    owner,
                    repo,
                    run_id: Number(process.env.GITHUB_RUN_ID),
                    per_page: 100,
                    page,
                  },
                );

                const pageArtifacts = response.data.artifacts || [];
                artifacts.push(...pageArtifacts);
                if (pageArtifacts.length < 100) {
                  break;
                }
                page += 1;
              }

              const matches = artifacts.filter((artifact) => artifact.name === artifactName);
              if (matches.length === 0) {
                throw new Error(`No artifacts named "${artifactName}" were found for this workflow run.`);
              }
              if (matches.length > 1) {
                throw new Error(`Multiple artifacts named "${artifactName}" were found for this workflow run.`);
              }
              return matches[0];
            }

            async function createDeployment(artifactId) {
              const idToken = await core.getIDToken();
              const response = await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments',
                {
                  owner,
                  repo,
                  artifact_id: artifactId,
                  pages_build_version: context.sha,
                  oidc_token: idToken,
                },
              );
              return response.data;
            }

            async function waitForDeployment(deploymentId) {
              while (true) {
                await sleep(retryDelayMs);
                try {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                    {
                      owner,
                      repo,
                      deployment_id: deploymentId,
                    },
                  );
                  const status = response.data.status;
                  core.info(`Deployment ${deploymentId} status: ${status}`);
                  if (status === 'succeed') {
                    return true;
                  }
                  if (
                    status === 'deployment_failed' ||
                    status === 'deployment_content_failed' ||
                    status === 'deployment_cancelled' ||
                    status === 'deployment_lost'
                  ) {
                    return false;
                  }
                } catch (error) {
                  core.warning(`Could not get deployment ${deploymentId} status: ${error.message}`);
                }
              }
            }

            const artifact = await getPagesArtifact();
            let attempt = 1;

            while (true) {
              try {
                core.info(`Creating GitHub Pages deployment, attempt ${attempt}.`);
                const deployment = await createDeployment(artifact.id);
                const deploymentId = deployment.id || deployment.status_url?.split('/').pop();

                if (!deploymentId) {
                  throw new Error('GitHub Pages deployment did not return an id.');
                }

                if (deployment.page_url) {
                  core.setOutput('page_url', deployment.page_url);
                }

                core.info(`Created deployment ${deploymentId}.`);
                if (await waitForDeployment(deploymentId)) {
                  core.info('GitHub Pages deployment succeeded.');
                  return;
                }

                core.warning(`GitHub Pages deployment ${deploymentId} failed. Retrying in 5 seconds.`);
              } catch (error) {
                core.warning(`GitHub Pages deployment attempt ${attempt} failed: ${error.message}`);
              }

              attempt += 1;
              await sleep(retryDelayMs);
            }
