[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["while"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-updater-kit = { git = "https://github.com/while-coder/tauri-updater-kit", branch = "main" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# 降低并行 codegen，规避 Windows 上交叉编译 Android 时 rustc 的间歇性堆损坏崩溃 (STATUS_HEAP_CORRUPTION)
[profile.release]
codegen-units = 1
